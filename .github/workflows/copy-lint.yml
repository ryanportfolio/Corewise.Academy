name: Copy lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  no-em-dash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # dependency-free script; no npm install needed
      - run: node site/scripts/no-em-dash.mjs
