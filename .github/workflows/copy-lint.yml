name: Copy lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  no-em-dash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # dependency-free script; no npm install needed
      - run: node site/scripts/no-em-dash.mjs

  readme-plate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # dependency-free: fails if the README plate or its printed numbers
      # drift from guide frontmatter, or if an em dash lands in the README
      - run: node scripts/readme-plate.mjs --check
